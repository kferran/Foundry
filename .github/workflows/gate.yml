# The gate (FOUNDRY.md Development) on every pull request and push. It runs only where the repository
# variable FOUNDRY_CI is 'true', so a vault that inherits this file stays inert.
name: gate
on:
  pull_request:
  push:
    branches: ['**']
jobs:
  gate:
    if: vars.FOUNDRY_CI == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install the development tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bats jq sqlite3 parallel shellcheck bubblewrap \
            python3-yaml python3-pytest python3-pytest-xdist
      # bwrap needs unprivileged user namespaces, which the runner's AppArmor policy restricts by default.
      - name: Allow unprivileged user namespaces for bwrap
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Set a git identity for the tests
        run: |
          git config --global user.name "Foundry CI"
          git config --global user.email "ci@example.invalid"
      - name: Gate
        run: system/scripts/verify_setup.sh --require-suites
  # Everything on (extensions spec §3): every tracked extensions/<name>/ is listed in a CI config, and the gate runs
  # core's and every extension's suites together. It prints one skip line and succeeds while no extension is tracked.
  gate-all-extensions:
    if: vars.FOUNDRY_CI == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: List every extension in a CI config
        id: cfg
        run: |
          shopt -s nullglob
          list=""
          for d in extensions/*/extension.md; do
            n="$(basename "$(dirname "$d")")"
            list+="${list:+, }\"$n\""
          done
          if [[ -z "$list" ]]; then
            echo "no extension is tracked: skipped"
            exit 0
          fi
          sed "s|^extensions: .*|extensions: [$list]|" system/config.example.md > system/config.md
          echo "configured=true" >> "$GITHUB_OUTPUT"
      - name: Install the development tools
        if: steps.cfg.outputs.configured == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bats jq sqlite3 parallel shellcheck bubblewrap \
            python3-yaml python3-pytest python3-pytest-xdist
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          git config --global user.name "Foundry CI"
          git config --global user.email "ci@example.invalid"
      - name: Check the extensions
        if: steps.cfg.outputs.configured == 'true'
        run: |
          system/scripts/extensions.py check
          system/scripts/extensions.py list
      - name: Gate, everything on
        if: steps.cfg.outputs.configured == 'true'
        run: system/scripts/verify_setup.sh --require-suites
