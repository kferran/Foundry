# The @@name@@ Source in the pipeline graph (factory F6 PR 2a, #477): system/tests/pipeline.bats checks it with
# --extensions. The Source runs inside the brief's prep; a step that takes a lock adds it under locks.
extends:
  brief:
    scripts: [extensions/@@name@@/scripts/@@name@@_fetch.sh]
    writes: [system/logs/inputs/, system/logs/@@name@@_fetch-*.jsonl]
